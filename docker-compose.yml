version: '3'

services:
  backend:
    image: eggsunsky/doctranslator:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend-container
    env_file:
      - ./backend/.env
    ports:
      - "5000:5000"
    volumes:
      - ./backend/db:/app/db
      - ./backend/storage:/app/storage
    environment:
      FLASK_ENV: production
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/translate/test', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - my-network

  worker:
    image: eggsunsky/doctranslator:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend-worker-container
    env_file:
      - ./backend/.env
    command: ["python", "worker.py"]
    volumes:
      - ./backend/db:/app/db
      - ./backend/storage:/app/storage
    environment:
      FLASK_ENV: production
      TRANSLATE_DEFAULT_CONCURRENCY: 2
      TRANSLATE_PDF_CONCURRENCY: 1
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - my-network

  redis:
    image: redis:7-alpine
    container_name: doctranslator-redis
    profiles: ["celery"]
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - my-network

  celery-document-worker:
    image: eggsunsky/doctranslator:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: doctranslator-celery-document
    profiles: ["celery"]
    env_file:
      - ./backend/.env
    command: ["celery", "-A", "app.celery_app:celery", "worker", "--queues=translation.default", "--concurrency=2", "--hostname=document@%h"]
    volumes:
      - ./backend/db:/app/db
      - ./backend/storage:/app/storage
    environment:
      FLASK_ENV: production
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - my-network

  celery-pdf-worker:
    image: eggsunsky/doctranslator:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: doctranslator-celery-pdf
    profiles: ["celery"]
    env_file:
      - ./backend/.env
    command: ["celery", "-A", "app.celery_app:celery", "worker", "--queues=translation.pdf", "--concurrency=1", "--hostname=pdf@%h"]
    volumes:
      - ./backend/db:/app/db
      - ./backend/storage:/app/storage
    environment:
      FLASK_ENV: production
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - my-network

  # ... existing code ...
  nginx:
    image: nginx:stable-alpine
    container_name: nginx-container
    ports:
      - "1475:80"
      - "8081:8081"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./frontend/dist:/usr/share/nginx/html/frontend
      - ./admin/dist:/usr/share/nginx/html/admin
    depends_on:
      - backend
    networks:
      - my-network

networks:
  my-network:
    driver: bridge

volumes:
  redis-data:
