# 前端路由
server {
    listen 80;
    # 允许最大 50MB 的请求体
    client_max_body_size 50M;
    root /usr/share/nginx/html/frontend;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 入口页与运行时配置不缓存：升级后浏览器必须拿到新的 bundle 引用
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location = /config.js {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # 带 hash 的静态资源可以长期缓存
    location /assets/ {
        expires 1y;
    }

    # 后端 API 路由
    location /api/ {
        proxy_pass http://backend-container:5000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # CORS 由后端 Flask-CORS 统一处理（回显 Origin、放行 token 头）。
        # 这里不要再 add_header Access-Control-*，否则会与后端响应头重复，
        # 浏览器会以「多个 Access-Control-Allow-Origin」为由拒绝跨源请求；
        # 也不要拦截 OPTIONS，否则预检请求拿不到 CORS 响应头。
    }
}

# 管理端路由
server {
    listen 8081;
    client_max_body_size 50M;
    root /usr/share/nginx/html/admin;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 入口页与运行时配置不缓存：升级后浏览器必须拿到新的 bundle 引用
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location = /config.js {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # 带 hash 的静态资源可以长期缓存
    location /static/ {
        expires 1y;
    }

    # 后端 API 路由
    location /api/ {
        proxy_pass http://backend-container:5000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # CORS 由后端 Flask-CORS 统一处理（回显 Origin、放行 token 头）。
        # 这里不要再 add_header Access-Control-*，否则会与后端响应头重复，
        # 浏览器会以「多个 Access-Control-Allow-Origin」为由拒绝跨源请求；
        # 也不要拦截 OPTIONS，否则预检请求拿不到 CORS 响应头。
    }
}
